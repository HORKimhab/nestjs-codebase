# version: "3.7"
name: nestjs_codebase
services:
  mariadb:
    image: mariadb:10.8
    ports:
      - 3306:3306
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
      # Row size too large (> 8126). Changing some columns to TEXT or BLOB may help. In current row format, BLOB prefix of 0 bytes is stored inline.
      - --innodb_file_per_table=ON
      # Error Code: 1118. Row size too large (> 8126). Changing some columns to TEXT or BLOB may help. In current row format,
      - --innodb_strict_mode=OFF
      - --innodb_default_row_format=DYNAMIC
      - --innodb_large_prefix=ON
      # - --innodb_page_size=64K

      - --innodb_log_file_size=500M # set log file size
      - --innodb_log_buffer_size=800M # set log buffer size
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
  # PMA_USER: root
  # PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  # ports:
  #   - 8080:80     # Access phpMyAdmin at http://localhost:8080

  # htpasswd-gen:
  #   image: httpd:alpine
  #   entrypoint: >
  #     sh -c "htpasswd -Bc /output/.htpasswd ${BASIC_AUTH_USER} ${BASIC_AUTH_PASSWORD}"
  #   volumes:
  #     - ./nginx:/output
  #   environment:
  #     BASIC_AUTH_USER: ${BASIC_AUTH_USER}
  #     BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
  #   restart: "no"

  # htpasswd-gen:
  #   image: httpd:alpine
  #   command: htpasswd -bc /output/.htpasswd "$BASIC_AUTH_USER" "$BASIC_AUTH_PASSWORD"
  #   volumes:
  #     - ./nginx:/output
  #   environment:
  #     BASIC_AUTH_USER: ${BASIC_AUTH_USER}
  #     BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
  #   restart: "no"

  nginx:
    image: nginx:alpine
    # build:
    #   context: .
    #   dockerfile: Dockerfile.nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - phpmyadmin

  # debug error 'htpasswd: cannot create file /output/.htpasswd'
  htpasswd-gen:
    image: httpd:alpine
    entrypoint: >
      sh -c 'if [ -z "$BASIC_AUTH_USER" ] || [ -z "$BASIC_AUTH_PASSWORD" ]; then echo "Missing BASIC_AUTH_USER or BASIC_AUTH_PASSWORD"; exit 1; fi && rm -rf /output/.htpasswd && htpasswd -bc /output/.htpasswd "$BASIC_AUTH_USER" "$BASIC_AUTH_PASSWORD"'
    volumes:
      - ./nginx:/output
    # - ./frappe-lms/nginx:/output
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
    restart: 'no'

